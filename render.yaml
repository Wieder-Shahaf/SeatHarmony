# Render Blueprint - Deploy backend service
# Frontend will be deployed separately as a Static Site through Render UI
# This file defines the backend API service

services:
  # Backend API Service (FastAPI)
  - type: web
    name: seatharmony-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && pip install -r tree-of-thought-llm/requirements.txt && cd tree-of-thought-llm && pip install -e ."
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false
      - key: WLSACCESSID
        sync: false
      - key: WLSSECRET
        sync: false
      - key: LICENSEID
        sync: false
